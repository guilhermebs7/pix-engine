name: Java CI/CD com Maven e PostgreSQL (Engine PIX)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pix_db_test
          POSTGRES_USER: pix_user_test
          POSTGRES_PASSWORD: pix_password_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pix_user_test -d pix_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar o código fonte
        uses: actions/checkout@v4

      - name: Configurar o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Rodar os Testes
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pix_db_test
          POSTGRES_USER: pix_user_test
          POSTGRES_PASSWORD: pix_password_test
        run: mvn -B clean verify

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Disparar Webhook de Deploy no Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"